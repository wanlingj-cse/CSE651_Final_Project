services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: peters-bakery-dev
    image: peters-bakery:latest
    restart: unless-stopped
    ports:
      - "${PORT:-3030}:80"
    volumes:
      # Live volume mount for immediate hot-reloading during development
      - ./:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 3s
